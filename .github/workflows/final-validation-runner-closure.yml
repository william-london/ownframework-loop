name: Final authority closure

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22
    paths:
      - .github/workflows/final-validation-runner-closure.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/github-authority-closure-2026-09-22
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install bounded uv authority
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            python3 -m pip install --break-system-packages uv || python3 -m pip install uv
          fi
          uv_source="$(command -v uv)"
          rm -rf /tmp/ofloop-ci-bin
          install -d -m 0755 /tmp/ofloop-ci-bin
          install -m 0755 "$uv_source" /tmp/ofloop-ci-bin/uv
          echo "/tmp/ofloop-ci-bin" >> "$GITHUB_PATH"
          export PATH="/tmp/ofloop-ci-bin:$PATH"
          test "$(command -v uv)" = "/tmp/ofloop-ci-bin/uv"
          uv --version

      - name: Apply and prove final authority closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/final_authority_closure.py')
          s = p.read_text(encoding='utf-8')
          for name in ('old', 'new', 'block', 'fn', 'new_fn', 'insertion'):
              s = s.replace(f"{name} = '''", f"{name} = r'''")
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile .github/final_authority_closure.py
          python3 .github/final_authority_closure.py

          # Finish the legacy-fixture migration discovered by the stricter
          # STATE/EVENTS authority proof. Deliberate post-seed corruption tests
          # remain raw; only setup fixtures are moved onto the test-only owner.
          python3 - <<'PY'
          from pathlib import Path

          # Retry-policy visibility scenario: this is a second synthetic state
          # in the same test file; the primary run-policy seed was migrated by
          # final_authority_closure.py above.
          p = Path('tests/integration/test_v061_supervisor_retry_usage_policy.sh')
          text = p.read_text(encoding='utf-8')
          old = r'''(vrd / "STATE.json").write_text(
    json.dumps({
        "state": "READY_FOR_REVIEW",
        "last_candidate_sha": candidate,
        "build_pass_count": 1,
        "review_pass_count": 0,
        "repair_round": 0,
        "spec_baseline_sha": baseline,
    }),
    encoding="utf-8",
)
'''
          new = r'''seed_state(vrepo, vrun, {
    "state": "READY_FOR_REVIEW",
    "last_candidate_sha": candidate,
    "build_pass_count": 1,
    "review_pass_count": 0,
    "repair_round": 0,
    "spec_baseline_sha": baseline,
}, reason="fixture visibility state")
'''
          if old not in text:
              raise SystemExit('retry-policy visibility STATE fixture anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # v099d contains two additional transport fixtures after the shared
          # write_canonical_state helper. Migrate those setup states without
          # changing their receipt/continuation semantics.
          p = Path('tests/integration/test_v099d_blocked_repair_context_propagated.sh')
          text = p.read_text(encoding='utf-8')
          g_start = text.index('# TEST G — CHANGES_REQUESTED')
          h_start = text.index('# TEST H — semantic invocation')
          i_start = text.index('# TEST I — exact values')

          g = text[g_start:h_start]
          old_import = "import json, sys\nfrom pathlib import Path\nrepo, rid = sys.argv[1], sys.argv[2]\n"
          new_import = "import json, os, sys\nfrom pathlib import Path\nsys.path.insert(0, str(Path(os.environ['OFLOOP_ROOT']) / 'tests' / 'helpers'))\nfrom state_seed import seed_state\nrepo, rid = sys.argv[1], sys.argv[2]\n"
          if old_import not in g:
              raise SystemExit('v099d TEST G import anchor missing')
          g = g.replace(old_import, new_import, 1)
          old_state = r'''(rd / 'STATE.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
# Delete EVENTS.log if present so integrity verify passes (no prior sha).
ep = rd / 'EVENTS.log'
if ep.exists():
    ep.unlink()
'''
          if old_state not in g:
              raise SystemExit('v099d TEST G STATE fixture anchor missing')
          g = g.replace(
              old_state,
              'seed_state(Path(repo), rid, state, reason="fixture CHANGES_REQUESTED transport state")\n',
              1,
          )

          h = text[h_start:i_start]
          old_import_h = "import json, sys, hashlib, subprocess\nfrom pathlib import Path\nrepo, rid = sys.argv[1], sys.argv[2]\n"
          new_import_h = "import json, os, sys, hashlib, subprocess\nfrom pathlib import Path\nsys.path.insert(0, str(Path(os.environ['OFLOOP_ROOT']) / 'tests' / 'helpers'))\nfrom state_seed import seed_state\nrepo, rid = sys.argv[1], sys.argv[2]\n"
          if old_import_h not in h:
              raise SystemExit('v099d TEST H import anchor missing')
          h = h.replace(old_import_h, new_import_h, 1)
          old_h_state = r'''(rd / 'STATE.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
'''
          if old_h_state not in h:
              raise SystemExit('v099d TEST H STATE fixture anchor missing')
          h = h.replace(
              old_h_state,
              'seed_state(Path(repo), rid, state, reason="fixture TEST H dispatch transport state")\n',
              1,
          )
          old_drop = r'''# Drop EVENTS.log so integrity.verify_state_sha passes (no prior sha recorded).
ep = rd / 'EVENTS.log'
if ep.exists():
    ep.unlink()

'''
          if old_drop not in h:
              raise SystemExit('v099d TEST H EVENTS reset anchor missing')
          h = h.replace(old_drop, '', 1)
          p.write_text(text[:g_start] + g + h + text[i_start:], encoding='utf-8')
          PY

          export PYTHONPATH="$PWD/lib${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m compileall -q lib/ownframework_loop bin/ofloop
          bash tests/unit/test_trust_approval.sh
          bash tests/unit/test_approval_pty_e2e.sh
          bash tests/integration/test_v061_runner_cost_proof.sh
          bash tests/integration/test_v10d_pre1_adversarial_fixes.sh
          bash tests/integration/test_v061_evidence_fail_closed.sh
          bash tests/integration/test_event_chain_concurrency_e2e.sh
          bash tests/unit/test_final_hardening_process_and_lock.sh
          bash tests/integration/test_v121_validation_authority_closure.sh
          bash tests/unit/test_v045_hardening.sh
          bash tests/integration/test_repair_round_budget.sh
          bash tests/integration/test_v061_supervisor_operator_safety.sh
          bash tests/integration/test_v061_supervisor_attempt_ledger.sh
          bash tests/integration/test_v061_supervisor_retry_usage_policy.sh
          bash tests/integration/test_v061_supervisor_autonomy_friction.sh
          bash tests/integration/test_v072_execution_closure.sh
          bash tests/integration/test_v083_supervisor_retire.sh
          bash tests/integration/test_v091_terminal_source_closure.sh
          bash tests/integration/test_v099d_blocked_repair_context_propagated.sh
          bash tests/integration/test_v10e_pre1_behavioral_proofs.sh
          ./validate.sh
          git diff --check

      - name: Publish closure and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/github-authority-closure-2026-09-22
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hardening/github-authority-closure-2026-09-22)"
          git rm .github/final_authority_closure.py
          git rm .github/workflows/final-validation-runner-closure.yml
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hardening: close final lifecycle and evidence authority gaps'
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
