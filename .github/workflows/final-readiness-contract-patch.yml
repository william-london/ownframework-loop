name: Final readiness lifecycle contract patch

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22
    paths:
      - .github/workflows/final-readiness-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/github-authority-closure-2026-09-22

      - name: Normalize bounded-runner refusal contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_present(path_s: str, old: str, new: str, *, expected_old_max: int = 1) -> None:
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count > expected_old_max:
                  raise SystemExit(f'{path_s}: unexpected old-contract multiplicity={count}')
              if count:
                  text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')

          # Version probe contract: lifecycle refusal means version unproven,
          # not an uncaught boundary exception.
          replace_if_present(
              'lib/ownframework_loop/supervisor_runner.py',
              '    except (OSError, subprocess.TimeoutExpired):\n        return None\n',
              '    except (OSError, subprocess.SubprocessError):\n        return None\n',
          )

          # Runtime-identity probes already fail closed; normalize all bounded
          # subprocess failures into their documented empty/RuntimeIdentityError paths.
          replace_if_present(
              'lib/ownframework_loop/runtime_identity.py',
              '(OSError, subprocess.TimeoutExpired)',
              '(OSError, subprocess.SubprocessError)',
              expected_old_max=2,
          )

          # Read-model observation is explicitly best-effort and returns an
          # error envelope; lifecycle refusal belongs in that envelope.
          replace_if_present(
              'lib/ownframework_loop/supervisor_readmodel.py',
              '    except (OSError, subprocess.TimeoutExpired) as exc:\n',
              '    except (OSError, subprocess.SubprocessError) as exc:\n',
          )

          # Dispatch owns a typed DispatchError boundary for finalizer transport.
          path = Path('lib/ownframework_loop/dispatch.py')
          text = path.read_text(encoding='utf-8')
          leak_block = '''    except process_runner.ProcessGroupLeakError as exc:\n        raise DispatchError(\n            f"ofloop {' '.join(args)} left descendant processes after command exit"\n        ) from exc\n'''
          if leak_block not in text:
              anchor = '''    except subprocess.TimeoutExpired as exc:\n        raise DispatchError(\n            f"ofloop {' '.join(args)} exceeded finalization wall budget "\n            f"({int(timeout_seconds or 0)}s)"\n        ) from exc\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('dispatch timeout boundary anchor missing or ambiguous')
              text = text.replace(anchor, anchor + leak_block, 1)
              path.write_text(text, encoding='utf-8')
          PY

          python3 -m compileall -q lib/ownframework_loop
          PYTHONPATH=lib python3 - <<'PY'
          from pathlib import Path
          from ownframework_loop import dispatch, process_runner, runtime_identity, supervisor_readmodel, supervisor_runner

          original = process_runner.run_bounded_capture
          def leak(*_args, **_kwargs):
              raise process_runner.ProcessGroupLeakError(['probe'])
          process_runner.run_bounded_capture = leak
          try:
              assert supervisor_runner._claude_cli_version('/fake/claude') is None
              assert runtime_identity._git_head(Path('/tmp')) == ''
              row = supervisor_readmodel._run_git_readonly(Path('/tmp'), ['status'])
              assert row['ok'] is False and row['returncode'] is None, row
              try:
                  dispatch._run_cli(['status'])
              except dispatch.DispatchError as exc:
                  assert 'descendant processes' in str(exc), exc
              else:
                  raise AssertionError('dispatch lifecycle refusal escaped DispatchError contract')
          finally:
              process_runner.run_bounded_capture = original
          print('FINAL_BOUNDED_REFUSAL_CONTRACTS=PASS')
          PY
          git diff --check

      - name: Commit refusal-contract closure
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- lib/ownframework_loop)" ]]; then
            echo 'All refusal contracts already closed by an earlier concurrent run.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ownframework_loop
          git commit -m 'hardening: normalize bounded lifecycle refusal contracts'
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
