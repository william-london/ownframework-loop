name: Final readiness lifecycle contract patch

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/github-authority-closure-2026-09-22
      - name: Normalize version-probe lifecycle refusal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/ownframework_loop/supervisor_runner.py')
          s = p.read_text(encoding='utf-8')
          old = '    except (OSError, subprocess.TimeoutExpired):\n        return None\n'
          new = '    except (OSError, subprocess.SubprocessError):\n        return None\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one Claude version exception contract, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m compileall -q lib/ownframework_loop
          PYTHONPATH=lib python3 - <<'PY'
          import os, stat, tempfile, textwrap, time
          from pathlib import Path
          from ownframework_loop import supervisor_runner

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              marker = root / 'survived'
              fake = root / 'claude'
              fake.write_text(textwrap.dedent(f'''\
                  #!/usr/bin/env python3
                  import subprocess, sys
                  if '--version' in sys.argv:
                      subprocess.Popen(
                          [sys.executable, '-c', "import pathlib,time; time.sleep(1); pathlib.Path({str(marker)!r}).write_text('bad'); time.sleep(30)"],
                          stdin=subprocess.DEVNULL,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                          close_fds=True,
                      )
                      print('2.1.999')
                      raise SystemExit(0)
                  raise SystemExit(2)
              '''), encoding='utf-8')
              fake.chmod(fake.stat().st_mode | stat.S_IXUSR)
              assert supervisor_runner._claude_cli_version(str(fake)) is None
              time.sleep(1.3)
              assert not marker.exists(), 'version-probe descendant survived lifecycle refusal'
          print('FINAL_READINESS_LIFECYCLE_CONTRACT=PASS')
          PY
          git diff --check
      - name: Commit readiness contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ownframework_loop/supervisor_runner.py
          git commit -m 'hardening: normalize runner version lifecycle refusal'
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
