name: Final hardening apply v4

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22
    paths:
      - .github/workflows/final-hardening-apply-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/github-authority-closure-2026-09-22
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply remaining source hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")
          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")
          def once(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one baseline match, found {n}")
              return text.replace(old, new, 1)
          def between(text: str, start: str, end: str, new: str, label: str) -> str:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{label}: baseline boundaries changed")
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + new + text[b:]

          # A — visible command reconstruction and direct Git transports.
          p = "lib/ownframework_loop/external_action.py"
          text = read(p)
          push = '    (re.compile(r"\\bgit\\s+push\\b"), "OF_LOOP_EXTERNAL_PR", "git push"),\n'
          text = once(
              text, push,
              push
              + '    (re.compile(r"\\bgit\\s+send-pack\\b"), "OF_LOOP_EXTERNAL_PR", "git send-pack"),\n'
              + '    (re.compile(r"\\bgit\\s+http-push\\b"), "OF_LOOP_EXTERNAL_PR", "git http-push"),\n'
              + '    (re.compile(r"\\bgit\\s+-c\\s+alias\\.[A-Za-z0-9_.-]+=(?:!?git\\s+)?(?:push|send-pack|http-push)\\b"), "OF_LOOP_EXTERNAL_PR", "inline git push alias"),\n',
              "external transport patterns",
          )
          normalizers = r'''def _normalize_python_argv(cmd: str) -> str:
              """Normalize flat literal argv at Python process-execution call sites.

              Arbitrary-length literal argv at subprocess call sites are
              reconstructed for classification. Unrelated data literals stay
              untouched; dynamic Python remains outside this textual proof.
              """
              import ast as _ast
              import re as _re

              call_re = _re.compile(
                  r"(?P<prefix>(?:\bsubprocess\.(?:run|Popen|call|check_call|check_output)"
                  r"|(?<![A-Za-z0-9_.])(?:run|Popen|call|check_call|check_output))"
                  r"\s*\(\s*)(?P<argv>\[[^\[\]\r\n]{1,16384}\]"
                  r"|(?<![A-Za-z0-9_.])\([^()\r\n]{1,16384}\))"
              )

              def normalize_container(raw: str) -> str | None:
                  try:
                      value = _ast.literal_eval(raw)
                  except (SyntaxError, ValueError):
                      if len(raw) < 2 or raw[0] not in "[(" or raw[-1] not in ")]":
                          return None
                      body = raw[1:-1]
                      if "," not in body:
                          return None
                      atoms = [item.strip() for item in body.split(",")]
                      if len(atoms) < 2 or any(not item for item in atoms):
                          return None
                      cleaned: list[str] = []
                      for atom in atoms:
                          if len(atom) >= 2 and atom[0] == atom[-1] and atom[0] in {"'", '"'}:
                              atom = atom[1:-1]
                          if (
                              not atom
                              or any(ch.isspace() for ch in atom)
                              or any(ch in atom for ch in "`$;|&()[]{}")
                          ):
                              return None
                          cleaned.append(atom)
                      return " ".join(cleaned)
                  if not isinstance(value, (list, tuple)) or len(value) < 2:
                      return None
                  if not all(isinstance(item, str) and item for item in value):
                      return None
                  return " ".join(str(item) for item in value)

              def repl(match: "_re.Match[str]") -> str:
                  normalized = normalize_container(match.group("argv"))
                  if normalized is None:
                      return match.group(0)
                  return match.group("prefix") + normalized

              out = call_re.sub(repl, cmd)
              out = _re.sub(
                  r'executable\s*=\s*[\'\"](\S+)[\'\"]\s*,\s*args\s*=\s*\[\s*[\'\"]([^\'\"]+)[\'\"]\s*\]',
                  lambda m: f"{m.group(1)} {m.group(2)}", out,
              )
              return out


          def _normalize_variable_assignment(cmd: str) -> str:
              """Resolve bounded visible shell assignment reconstruction."""
              import re as _re

              mapping: dict[str, str] = {}
              parts = _re.split(r"(?:&&|\|\||;|\r?\n)", cmd)
              rebuilt: list[str] = []
              assignment_re = _re.compile(
                  r"""\s*([A-Za-z_][A-Za-z0-9_]*)=(?:"([^"\r\n]*)"|'([^'\r\n]*)'|([^\s;]+))"""
              )
              variable_re = _re.compile(
                  r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}|\$([A-Za-z_][A-Za-z0-9_]*)"
              )

              def substitute(value: str) -> str:
                  def sub(match: "_re.Match[str]") -> str:
                      var = match.group(1) or match.group(2)
                      return mapping.get(var, match.group(0))
                  return variable_re.sub(sub, value)

              for part in parts:
                  part_stripped = part.lstrip()
                  cursor = 0
                  export = _re.match(r"(?:export|readonly)\s+", part_stripped)
                  if export:
                      cursor = export.end()
                  while True:
                      match = assignment_re.match(part_stripped, cursor)
                      if not match:
                          break
                      raw_value = next(v for v in match.groups()[1:] if v is not None)
                      mapping[match.group(1)] = substitute(raw_value)
                      cursor = match.end()
                  rebuilt.append(substitute(part_stripped))
              return ";".join(rebuilt)


          '''
          text = between(
              text,
              "def _normalize_python_argv(cmd: str) -> str:\n",
              "def _normalize_hyphenated_executable(cmd: str) -> str:\n",
              textwrap.dedent(normalizers),
              "external normalizers",
          )
          text = once(
              text,
              '        ("git-push", "git push"),\n',
              '        ("git-push", "git push"),\n'
              '        ("git-send-pack", "git send-pack"),\n'
              '        ("git-http-push", "git http-push"),\n',
              "hyphenated transports",
          )
          write(p, text)

          p = "lib/ownframework_loop/guards.py"
          text = read(p)
          first = '    (re.compile(r"\\bgit\\s+push\\b"), "git push is prohibited", "subcommand"),\n'
          text = once(
              text, first,
              first
              + '    (re.compile(r"\\bgit\\s+send-pack\\b"), "git send-pack is prohibited", "subcommand"),\n'
              + '    (re.compile(r"\\bgit\\s+http-push\\b"), "git http-push is prohibited", "subcommand"),\n'
              + '    (re.compile(r"\\bgit\\s+-c\\s+alias\\.[A-Za-z0-9_.-]+=(?:!?git\\s+)?(?:push|send-pack|http-push)\\b"), "inline git push alias is prohibited", "subcommand"),\n',
              "guard transport patterns",
          )
          write(p, text)

          # A — bind private authority validation and consumption to one fd.
          p = "lib/ownframework_loop/util.py"
          text = read(p)
          reader = r'''def read_private_json(path: Path, default: Any = None) -> Any:
              """Read one supervisor-owned private JSON authority artifact safely.

              Validation and consumption are bound to one opened descriptor.
              Redirected, non-regular, wrong-owner, loose-mode, missing, or
              malformed artifacts fail closed to ``default``.
              """
              p = Path(path)
              nofollow = int(getattr(os, "O_NOFOLLOW", 0) or 0)
              fd: int | None = None
              try:
                  fd = os.open(str(p), os.O_RDONLY | nofollow)
                  st = os.fstat(fd)
                  if not stat.S_ISREG(st.st_mode):
                      return default
                  if hasattr(os, "getuid") and st.st_uid != os.getuid():
                      return default
                  if stat.S_IMODE(st.st_mode) & 0o077:
                      return default
                  if not nofollow:
                      lst = os.lstat(str(p))
                      if stat.S_ISLNK(lst.st_mode):
                          return default
                      if (lst.st_dev, lst.st_ino) != (st.st_dev, st.st_ino):
                          return default
                  stream = os.fdopen(fd, "r", encoding="utf-8")
                  fd = None
                  with stream:
                      return json.load(stream)
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  return default
              finally:
                  if fd is not None:
                      try:
                          os.close(fd)
                      except OSError:
                          pass


          '''
          text = between(
              text,
              "def read_private_json(path: Path, default: Any = None) -> Any:\n",
              "def fsync_dir(dirpath: Path) -> None:\n",
              textwrap.dedent(reader),
              "private json reader",
          )
          write(p, text)

          # B — lifecycle transition must retain durable row authority.
          p = "lib/ownframework_loop/supervisor_db.py"
          text = read(p)
          text = once(
              text,
              '    if row is None:\n        return\n    conn.execute(\n',
              '    if row is None:\n'
              '        conn.rollback()\n'
              '        raise RuntimeError(\n'
              '            f"job transition lost durable row authority: job_id={int(job_id)}"\n'
              '        )\n'
              '    cur = conn.execute(\n',
              "missing job transition",
          )
          text = once(
              text,
              '    )\n    conn.commit()\n\n\ndef _persist_job_last_error(\n',
              '    )\n'
              '    if cur.rowcount != 1:\n'
              '        conn.rollback()\n'
              '        raise RuntimeError(\n'
              '            f"job transition lost durable row authority during update: job_id={int(job_id)}"\n'
              '        )\n'
              '    conn.commit()\n\n\ndef _persist_job_last_error(\n',
              "job transition rowcount",
          )
          write(p, text)

          # C — every successful quarantine branch counts as recovered.
          p = "lib/ownframework_loop/supervisor_recovery.py"
          text = read(p)
          text = once(
              text,
              '''                conn.commit()\n                continue\n\n            if (\n                str(attempt["status"] or "") == "RESERVED"\n''',
              '''                conn.commit()\n                recovered += 1\n                continue\n\n            if (\n                str(attempt["status"] or "") == "RESERVED"\n''',
              "missing-attempt recovery count",
          )
          text = once(
              text,
              '''                    conn.commit()\n                    continue\n\n                effective_cost = (\n''',
              '''                    conn.commit()\n                    recovered += 1\n                    continue\n\n                effective_cost = (\n''',
              "cost-unknown recovery count",
          )
          text = once(
              text,
              '''                    conn.commit()\n                    continue\n\n                usage = recovered_usage or {}\n''',
              '''                    conn.commit()\n                    recovered += 1\n                    continue\n\n                usage = recovered_usage or {}\n''',
              "token-unknown recovery count",
          )
          write(p, text)

          # B — drain proof excludes only its own ps process by exact PID.
          p = "lib/ownframework_loop/process_runner.py"
          text = read(p)
          old = '''    try:\n        result = subprocess.run(\n            ["ps", "-axo", "pid=,ppid=,stat=,comm="],\n            capture_output=True, text=True, check=False, timeout=5,\n        )\n    except (subprocess.TimeoutExpired, FileNotFoundError, OSError):\n        return False\n    if result.returncode != 0 or not result.stdout.strip():\n        return False\n    own_pid = os.getpid()\n'''
          new = '''    probe: subprocess.Popen[str] | None = None\n    try:\n        probe = subprocess.Popen(\n            ["ps", "-axo", "pid=,ppid=,stat=,comm="],\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.DEVNULL,\n            text=True,\n        )\n        probe_pid = int(probe.pid)\n        stdout, _ = probe.communicate(timeout=5)\n    except (subprocess.TimeoutExpired, FileNotFoundError, OSError):\n        if probe is not None and probe.poll() is None:\n            try:\n                probe.kill()\n                probe.wait(timeout=2)\n            except (OSError, subprocess.TimeoutExpired):\n                pass\n        return False\n    if probe.returncode != 0 or not stdout.strip():\n        return False\n    own_pid = os.getpid()\n'''
          text = once(text, old, new, "ps probe")
          text = once(text, '    for line in result.stdout.splitlines():\n', '    for line in stdout.splitlines():\n', "ps stdout")
          text = once(
              text,
              '''        # The probe's own `ps` child appears in ps's own row at the moment\n        # ps walks /proc. That is the calling-side race, not a leak.\n        if pid_str == str(own_pid):\n            continue\n        if comm.startswith("ps"):\n            continue\n''',
              '''        # Ignore the probe by exact PID only; executable-name prefixes\n        # are not identity proof for leaked descendants.\n        if pid_str == str(probe_pid):\n            continue\n''',
              "ps name bypass",
          )
          write(p, text)

          # Canonical regression for this closure set. Existing concurrent
          # process/lock regression remains separately canonical.
          path = Path("tests/integration/test_v122_final_source_hardening.sh")
          if path.exists():
              raise SystemExit("v122 hardening regression already exists; re-adjudicate")
          path.write_text(textwrap.dedent(r'''\
              #!/usr/bin/env bash
              set -euo pipefail
              HERE="$(cd "$(dirname "$0")" && pwd)"
              . "$HERE/../_helpers.sh"
              ROOT_DIR="$(cd "$HERE/../.." && pwd)"
              export PYTHONPATH="$ROOT_DIR/lib${PYTHONPATH:+:$PYTHONPATH}"

              python3 -B <<'PYTEST'
              import fcntl
              import inspect
              import json
              import os
              import sqlite3
              import tempfile
              from pathlib import Path
              from ownframework_loop import external_action, guards, locking, process_runner
              from ownframework_loop import supervisor_db, supervisor_recovery, util

              blocked = [
                  "X=git Y=push; ${X} ${Y} origin main",
                  "X=git && Y=push && ${X} ${Y} origin main",
                  "python -c \"import subprocess; subprocess.run(['git','push','--force','origin','main'])\"",
                  "git send-pack origin refs/heads/main",
                  "git http-push https://example.invalid/repo.git",
                  "git -c alias.ship=push ship origin main",
              ]
              for command in blocked:
                  d = external_action.classify_tool_call(tool_name="Bash", tool_input={"command": command}, active_run="run-hardening")
                  assert d.startswith("BLOCK:"), (command, d)
                  g = guards.classify_bash_command(command, role="builder")
                  assert g["severity"] == "forbidden", (command, g)

              harmless = "python -c \"print(['git','push','docs','only','x'])\""
              assert external_action.classify_tool_call(tool_name="Bash", tool_input={"command": harmless}, active_run="run-hardening") == "ALLOW"
              assert guards.classify_bash_command(harmless, role="builder")["severity"] == "allowed"

              with tempfile.TemporaryDirectory() as td:
                  p = Path(td) / "authority.json"
                  p.write_text(json.dumps({"ok": True}), encoding="utf-8")
                  os.chmod(p, 0o600)
                  original = Path.read_text
                  Path.read_text = lambda *a, **k: (_ for _ in ()).throw(AssertionError("pathname reopened"))
                  try:
                      assert util.read_private_json(p) == {"ok": True}
                  finally:
                      Path.read_text = original
                  link = Path(td) / "link.json"
                  link.symlink_to(p)
                  assert util.read_private_json(link, default="refused") == "refused"
              src = inspect.getsource(util.read_private_json)
              assert "os.open" in src and "os.fstat" in src and "O_NOFOLLOW" in src
              assert ".read_text" not in src

              conn = sqlite3.connect(":memory:")
              conn.row_factory = sqlite3.Row
              conn.execute("CREATE TABLE jobs (id INTEGER PRIMARY KEY)")
              try:
                  supervisor_db._update_job(conn, 777, status_value="QUEUED")
              except RuntimeError as exc:
                  assert "lost durable row authority" in str(exc)
              else:
                  raise AssertionError("missing job row silently accepted")
              assert "cur.rowcount != 1" in inspect.getsource(supervisor_db._update_job)
              conn.close()

              with tempfile.TemporaryDirectory() as td:
                  lp = Path(td) / "busy.lock"
                  fd = os.open(str(lp), os.O_CREAT | os.O_RDWR, 0o600)
                  try:
                      fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                      try:
                          with locking.flock_shared(lp, blocking=False):
                              raise AssertionError("shared lock acquired")
                      except locking.LockBusyError:
                          pass
                  finally:
                      fcntl.flock(fd, fcntl.LOCK_UN)
                      os.close(fd)

              conn = sqlite3.connect(":memory:")
              conn.row_factory = sqlite3.Row
              conn.executescript("""
              CREATE TABLE jobs (
                id INTEGER PRIMARY KEY, status TEXT, worker_role TEXT, worker_pid INTEGER,
                worker_started_at REAL, worker_pgid INTEGER, worker_deadline_at REAL,
                worker_start_identity TEXT, worker_attempt_id TEXT,
                max_total_cost_usd REAL DEFAULT 0, max_total_tokens INTEGER DEFAULT 0,
                last_error TEXT, last_failure_class TEXT, last_failure_reason TEXT,
                next_attempt_at REAL DEFAULT 0, updated_at REAL
              );
              CREATE TABLE semantic_attempts (attempt_id TEXT, job_id INTEGER);
              INSERT INTO jobs (id,status,worker_role,worker_pid,worker_started_at,worker_pgid,worker_deadline_at,worker_start_identity,worker_attempt_id,updated_at)
              VALUES (1,'RUNNING','builder',NULL,NULL,NULL,NULL,'','missing-attempt',0);
              """)
              old_local = supervisor_recovery._process_mod._local_execution_owned
              old_alive = supervisor_recovery._process_mod._pid_alive
              try:
                  supervisor_recovery._process_mod._local_execution_owned = lambda job_id: False
                  supervisor_recovery._process_mod._pid_alive = lambda pid, started_at: False
                  recovered = supervisor_recovery._recover_stale_running(conn)
              finally:
                  supervisor_recovery._process_mod._local_execution_owned = old_local
                  supervisor_recovery._process_mod._pid_alive = old_alive
              assert recovered == 1, recovered
              assert conn.execute("SELECT status FROM jobs WHERE id=1").fetchone()[0] == "QUARANTINED"
              conn.close()

              drain = inspect.getsource(process_runner.process_group_drained)
              assert 'comm.startswith("ps")' not in drain and "probe_pid" in drain
              print("V122_FINAL_SOURCE_HARDENING=PASS")
              PYTEST

              pass "final source hardening regressions"
          '''), encoding="utf-8")
          path.chmod(0o755)
          canonical = Path("tests/canonical.txt")
          canon = canonical.read_text(encoding="utf-8")
          entry = "tests/integration/test_v122_final_source_hardening.sh"
          if entry in canon:
              raise SystemExit("v122 already registered")
          canonical.write_text(canon.rstrip() + "\n" + entry + "\n", encoding="utf-8")
          PY
      - name: Focused proof
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/lib${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m compileall -q lib
          bash tests/integration/test_v122_final_source_hardening.sh
          bash tests/unit/test_final_hardening_process_and_lock.sh
          bash tests/integration/test_v085_network_mutation_defense.sh
          bash tests/integration/test_v10d_pre1_adversarial_fixes.sh
          bash tests/integration/test_runtime_recovery_lane.sh
          python3 -B -m ownframework_loop.static_checks "$PWD"
          git diff --check
      - name: Commit only if branch stayed still
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/github-authority-closure-2026-09-22
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hardening/github-authority-closure-2026-09-22)"
          git rm .github/workflows/final-hardening-apply.yml \
                 .github/workflows/final-hardening-apply-v2.yml \
                 .github/workflows/final-hardening-apply-v3.yml \
                 .github/workflows/final-hardening-apply-v4.yml
          git add lib/ownframework_loop/external_action.py \
                  lib/ownframework_loop/guards.py \
                  lib/ownframework_loop/util.py \
                  lib/ownframework_loop/supervisor_db.py \
                  lib/ownframework_loop/supervisor_recovery.py \
                  lib/ownframework_loop/process_runner.py \
                  tests/integration/test_v122_final_source_hardening.sh \
                  tests/canonical.txt
          git diff --cached --check
          git config user.name "OwnFramework hardening bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "hardening: close final source authority defects"
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
