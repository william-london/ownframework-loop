name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          python3 --version
          git --version
      - name: Fetch canonical PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags https://github.com/${{ github.repository }}.git ${{ github.base_ref }}:refs/remotes/upstream/${{ github.base_ref }}
      - name: Diff check (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check upstream/${{ github.base_ref }}...HEAD
      - name: Diff check (push/manual)
        if: github.event_name != 'pull_request'
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
      - name: Python compile
        run: python3 -m compileall -q lib bin/ofloop
      - name: Canonical validation
        run: ./validate.sh

  release-gate:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Release gate
        env:
          OFLOOP_RELEASE_GATE_EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./release_gate.sh

  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Adapter conformance
        run: bash tests/test_run_adapter_conformance.sh
      - name: Adapter portability
        run: bash tests/integration/test_adapter_portability.sh
      - name: Adapter CLI
        run: bash tests/integration/test_adapter_cli.sh
      - name: Adapter distribution
        run: bash tests/integration/test_codex_adapter_install.sh
      - name: Adapter doctor
        run: |
          ./bin/ofloop adapter list
          ./bin/ofloop adapter doctor claude-code
          ./bin/ofloop adapter doctor generic-cli
          ./bin/ofloop adapter doctor codex --allow-unverified

  claude-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install current Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
      - name: Strict Claude plugin validation
        run: claude plugin validate . --strict
      - name: Isolated managed install and uninstall
        run: |
          export HOME="$RUNNER_TEMP/claude-home"
          mkdir -p "$HOME"
          bash install-adapter.sh claude-code
          claude plugin list | tee "$RUNNER_TEMP/claude-plugin-list.txt"
          grep -F 'of-loop@ownframework' "$RUNNER_TEMP/claude-plugin-list.txt"
          # v0.4.4: derive expected version from the canonical machine
          # source-of-truth, do NOT hardcode the release number into CI.
          EXPECTED_VERSION="$(PYTHONPATH="$PWD/lib" python3 -c 'from ownframework_loop import __version__; print(__version__)')"
          grep -F "$EXPECTED_VERSION" "$RUNNER_TEMP/claude-plugin-list.txt"
          REMOVE_MARKETPLACE=1 bash uninstall-adapter.sh claude-code
          bash uninstall.sh

  codex-adapter-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install current Codex CLI
        run: |
          npm install -g @openai/codex@latest
          codex --version
          codex --help >/tmp/codex-help.txt
          test -s /tmp/codex-help.txt
      - name: Prove isolated Codex adapter distribution
        run: |
          export HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$HOME"
          bash install-adapter.sh codex | tee "$RUNNER_TEMP/codex-install.txt"
          grep -F 'ADAPTER_INSTALL=PASS' "$RUNNER_TEMP/codex-install.txt"
          "$HOME/.local/bin/ofloop" adapter show codex | tee "$RUNNER_TEMP/codex-adapter.json"
          grep -F '"maturity": "experimental"' "$RUNNER_TEMP/codex-adapter.json"
          grep -F '"live_verified": false' "$RUNNER_TEMP/codex-adapter.json"
          for skill in of-loop-spec of-loop-build of-loop-review of-loop-status; do
            test -f "$HOME/.agents/skills/$skill/SKILL.md"
          done
          bash uninstall-adapter.sh codex
      - name: Portable contract remains unverified until authenticated runtime proof
        run: bash tests/integration/test_adapter_portability.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
