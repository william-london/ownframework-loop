name: Final core subprocess closure

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22
    paths:
      - .github/workflows/final-core-subprocess-closure.yml
      - .github/final_core_subprocess_closure.py

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/github-authority-closure-2026-09-22
          fetch-depth: 0

      - name: Apply audited source transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 .github/final_core_subprocess_closure.py
          export OFLOOP_ROOT="$PWD"
          export PYTHONPATH="$PWD/lib${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m compileall -q lib/ownframework_loop
          bash tests/unit/test_final_hardening_process_and_lock.sh
          bash tests/integration/test_v122_final_source_hardening.sh
          bash tests/integration/test_runtime_recovery_lane.sh
          python3 -B -m ownframework_loop.static_checks "$PWD"
          git diff --check

      - name: Publish closure and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/github-authority-closure-2026-09-22
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hardening/github-authority-closure-2026-09-22)"
          git rm .github/workflows/final-core-subprocess-closure.yml \
                 .github/final_core_subprocess_closure.py
          git add lib/ownframework_loop tests/unit/test_final_hardening_process_and_lock.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hardening: close core subprocess lifecycle authority'
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
