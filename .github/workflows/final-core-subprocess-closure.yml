name: Final core subprocess closure

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22
    paths:
      - .github/workflows/final-core-subprocess-closure.yml
      - .github/final_core_subprocess_closure.py

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/github-authority-closure-2026-09-22
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply audited source transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 .github/final_core_subprocess_closure.py

          # Repair the one remaining stale regression at the real scheduling-
          # identity probe owner. Production behavior is already correct; the
          # old test monkeypatched supervisor.subprocess.run after ownership
          # moved into supervisor_identity.git_checks.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/test_v090_bounded_concurrency.sh')
          text = p.read_text(encoding='utf-8')
          old = '''orig_run = supervisor.subprocess.run\ndef _fail_git_probe(*args, **kwargs):\n    raise OSError("synthetic git identity probe failure")\nsupervisor.subprocess.run = _fail_git_probe\ntry:\n    identity_key, identity_proven = supervisor._repository_scheduling_identity(identity_repo)\nfinally:\n    supervisor.subprocess.run = orig_run\n'''
          new = '''orig_run = supervisor_identity.git_checks.run_subprocess\ndef _fail_git_probe(*args, **kwargs):\n    raise OSError("synthetic git identity probe failure")\nsupervisor_identity.git_checks.run_subprocess = _fail_git_probe\ntry:\n    identity_key, identity_proven = supervisor._repository_scheduling_identity(identity_repo)\nfinally:\n    supervisor_identity.git_checks.run_subprocess = orig_run\n'''
          count = text.count(old)
          if count > 1:
              raise SystemExit(f'v090 stale identity fixture multiplicity={count}')
          if count == 1:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'orig_run = supervisor_identity.git_checks.run_subprocess' not in text:
              raise SystemExit('v090 scheduling-identity regression is neither old nor repaired')
          PY

          export OFLOOP_ROOT="$PWD"
          export PYTHONPATH="$PWD/lib${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m compileall -q lib/ownframework_loop
          bash tests/unit/test_final_hardening_process_and_lock.sh
          bash tests/integration/test_gate_fault_injection.sh
          bash tests/integration/test_v082_production_hardening.sh
          bash tests/integration/test_v090_bounded_concurrency.sh
          bash tests/integration/test_v122_final_source_hardening.sh
          bash tests/integration/test_runtime_recovery_lane.sh
          python3 -B -m ownframework_loop.static_checks "$PWD"
          git diff --check

      - name: Publish closure and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/github-authority-closure-2026-09-22
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hardening/github-authority-closure-2026-09-22)"
          git rm .github/workflows/final-core-subprocess-closure.yml \
                 .github/final_core_subprocess_closure.py
          git add lib/ownframework_loop \
                  tests/unit/test_final_hardening_process_and_lock.sh \
                  tests/integration/test_v090_bounded_concurrency.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hardening: close core subprocess lifecycle authority'
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
