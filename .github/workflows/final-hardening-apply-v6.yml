name: Final hardening apply v6

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22
    paths:
      - .github/workflows/final-hardening-apply-v6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/github-authority-closure-2026-09-22
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited transformation with literal-safe generator fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/final-hardening-apply-v4.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker, workflow.index('- name: Apply remaining source hardening')) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('v4 transformation indentation contract changed')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'

          old = "path.write_text(textwrap.dedent(r'''" + chr(92) + "\n"
          new = "path.write_text(textwrap.dedent(r'''\n"
          if script.count(old) != 1:
              raise SystemExit(f'expected one raw dedent sentinel, found {script.count(old)}')
          script = script.replace(old, new, 1)

          old_tail = "'''), encoding=\"utf-8\")\npath.chmod(0o755)"
          new_tail = "''').lstrip(), encoding=\"utf-8\")\npath.chmod(0o755)"
          if script.count(old_tail) != 1:
              raise SystemExit(f'expected one test write tail, found {script.count(old_tail)}')
          script = script.replace(old_tail, new_tail, 1)

          exec(compile(script, '<final-hardening-v4-transform>', 'exec'))
          PY
      - name: Focused proof
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/lib${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m compileall -q lib
          bash tests/integration/test_v122_final_source_hardening.sh
          bash tests/unit/test_final_hardening_process_and_lock.sh
          bash tests/integration/test_v085_network_mutation_defense.sh
          bash tests/integration/test_v10d_pre1_adversarial_fixes.sh
          bash tests/integration/test_runtime_recovery_lane.sh
          python3 -B -m ownframework_loop.static_checks "$PWD"
          git diff --check
      - name: Commit only if branch stayed still
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/github-authority-closure-2026-09-22
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hardening/github-authority-closure-2026-09-22)"
          git rm .github/workflows/final-hardening-apply.yml \
                 .github/workflows/final-hardening-apply-v2.yml \
                 .github/workflows/final-hardening-apply-v3.yml \
                 .github/workflows/final-hardening-apply-v4.yml \
                 .github/workflows/final-hardening-apply-v5.yml \
                 .github/workflows/final-hardening-apply-v6.yml
          git add lib/ownframework_loop/external_action.py \
                  lib/ownframework_loop/guards.py \
                  lib/ownframework_loop/util.py \
                  lib/ownframework_loop/supervisor_db.py \
                  lib/ownframework_loop/supervisor_recovery.py \
                  lib/ownframework_loop/process_runner.py \
                  tests/integration/test_v122_final_source_hardening.sh \
                  tests/canonical.txt
          git diff --cached --check
          git config user.name "OwnFramework hardening bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "hardening: close final source authority defects"
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
