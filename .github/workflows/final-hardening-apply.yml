name: Final hardening apply

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22
    paths:
      - .github/workflows/final-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "597b1b121c3246100978f480fcf8c50456ef373d"
      - name: Apply bounded source hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, new: str, label: str) -> str:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{label}: boundary mismatch")
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + new + text[b:]

          # A: external-action normalization must close visible shell/argv
          # reconstruction without turning arbitrary Python data literals into
          # executable commands.
          p = "lib/ownframework_loop/external_action.py"
          text = read(p)
          git_push = '    (re.compile(r"\\bgit\\s+push\\b"), "OF_LOOP_EXTERNAL_PR", "git push"),\n'
          git_blocks = git_push + (
              '    (re.compile(r"\\bgit\\s+send-pack\\b"), "OF_LOOP_EXTERNAL_PR", "git send-pack"),\n'
              '    (re.compile(r"\\bgit\\s+http-push\\b"), "OF_LOOP_EXTERNAL_PR", "git http-push"),\n'
              '    (re.compile(r"\\bgit\\s+-c\\s+alias\\.[A-Za-z0-9_.-]+=(?:!?git\\s+)?(?:push|send-pack|http-push)\\b"), "OF_LOOP_EXTERNAL_PR", "inline git push alias"),\n'
          )
          text = replace_once(text, git_push, git_blocks, "external git transport blocks")

          new_normalizers = r'''def _normalize_python_argv(cmd: str) -> str:
              """Normalize flat literal argv only at Python process-execution call sites.

              This closes arbitrary-length literal argv reconstruction such as
              ``subprocess.run(["git", "push", "--force", "origin", "main"])``
              without treating an unrelated data literal like
              ``print(["git", "push", ...])`` as an executable command.

              The classifier remains deliberately bounded: dynamic Python code is
              owned by the commissioned execution/network boundary and post-pass
              verification rather than guessed by a textual parser.
              """
              import ast as _ast
              import re as _re

              call_re = _re.compile(
                  r"(?P<prefix>(?:\\bsubprocess\\.(?:run|Popen|call|check_call|check_output)"
                  r"|(?<![A-Za-z0-9_.])(?:run|Popen|call|check_call|check_output))"
                  r"\\s*\\(\\s*)(?P<argv>\\[[^\\[\\]\\r\\n]{1,16384}\\]"
                  r"|(?<![A-Za-z0-9_.])\\([^()\\r\\n]{1,16384}\\))"
              )

              def normalize_container(raw: str) -> str | None:
                  try:
                      value = _ast.literal_eval(raw)
                  except (SyntaxError, ValueError):
                      if len(raw) < 2 or raw[0] not in "[(" or raw[-1] not in ")]":
                          return None
                      body = raw[1:-1]
                      if "," not in body:
                          return None
                      atoms = [item.strip() for item in body.split(",")]
                      if len(atoms) < 2 or any(not item for item in atoms):
                          return None
                      cleaned: list[str] = []
                      for atom in atoms:
                          if (
                              len(atom) >= 2
                              and atom[0] == atom[-1]
                              and atom[0] in {"'", '"'}
                          ):
                              atom = atom[1:-1]
                          # A flat argv atom may contain paths, URLs, flags and
                          # refspec punctuation, but not shell control or nested
                          # dynamic expansion. Dynamic forms remain unproven.
                          if (
                              not atom
                              or any(ch.isspace() for ch in atom)
                              or any(ch in atom for ch in "`$;|&()[]{}")
                          ):
                              return None
                          cleaned.append(atom)
                      return " ".join(cleaned)
                  if not isinstance(value, (list, tuple)) or len(value) < 2:
                      return None
                  if not all(isinstance(item, str) and item for item in value):
                      return None
                  return " ".join(str(item) for item in value)

              def repl(match: "_re.Match[str]") -> str:
                  normalized = normalize_container(match.group("argv"))
                  if normalized is None:
                      return match.group(0)
                  return match.group("prefix") + normalized

              out = call_re.sub(repl, cmd)
              # Imported/direct system forms already expose a contiguous command
              # after quote normalization; preserve the historical named-args
              # seam for callers that encode executable + one args literal.
              out = _re.sub(
                  r'executable\\s*=\\s*[\\\'"](\\S+)[\\\'"]\\s*,\\s*args\\s*=\\s*\\[\\s*[\\\'"]([^\\\'"]+)[\\\'"]\\s*\\]',
                  lambda m: f"{m.group(1)} {m.group(2)}", out,
              )
              return out


          def _normalize_variable_assignment(cmd: str) -> str:
              """Resolve bounded, visible shell assignment reconstruction.

              Handles multiple leading assignments in one assignment-only
              segment and both ``$VAR`` and ``${VAR}`` references. Assignment
              state is carried across the ordinary shell sequencing operators
              where assignment-only commands persist in the current shell.
              """
              import re as _re

              mapping: dict[str, str] = {}
              parts = _re.split(r"(?:&&|\\|\\||;|\\r?\\n)", cmd)
              rebuilt: list[str] = []
              assignment_re = _re.compile(
                  r"\\s*([A-Za-z_][A-Za-z0-9_]*)="
                  r'(?:"([^"\\r\\n]*)"|\\\'([^\\\'\\r\\n]*)\\\'|([^\\s;]+))'
              )
              variable_re = _re.compile(
                  r"\\$\\{([A-Za-z_][A-Za-z0-9_]*)\\}|\\$([A-Za-z_][A-Za-z0-9_]*)"
              )

              def substitute(value: str) -> str:
                  def sub(match: "_re.Match[str]") -> str:
                      var = match.group(1) or match.group(2)
                      return mapping.get(var, match.group(0))
                  return variable_re.sub(sub, value)

              for part in parts:
                  part_stripped = part.lstrip()
                  cursor = 0
                  export = _re.match(r"(?:export|readonly)\\s+", part_stripped)
                  if export:
                      cursor = export.end()
                  while True:
                      match = assignment_re.match(part_stripped, cursor)
                      if not match:
                          break
                      raw_value = next(
                          value for value in match.groups()[1:] if value is not None
                      )
                      # Resolve only already-proven simple assignments; shell
                      # substitutions/backticks remain visible/unresolved.
                      mapping[match.group(1)] = substitute(raw_value)
                      cursor = match.end()
                  rebuilt.append(substitute(part_stripped))
              return ";".join(rebuilt)


          '''
          text = replace_between(
              text,
              "def _normalize_python_argv(cmd: str) -> str:\n",
              "def _normalize_hyphenated_executable(cmd: str) -> str:\n",
              new_normalizers,
              "external normalizers",
          )
          text = replace_once(
              text,
              '        ("git-push", "git push"),\n',
              '        ("git-push", "git push"),\n'
              '        ("git-send-pack", "git send-pack"),\n'
              '        ("git-http-push", "git http-push"),\n',
              "hyphenated git transport normalization",
          )
          write(p, text)

          # A/B defense-in-depth layer must independently know the direct Git
          # transport primitives and inline alias form.
          p = "lib/ownframework_loop/guards.py"
          text = read(p)
          first_push = '    (re.compile(r"\\bgit\\s+push\\b"), "git push is prohibited", "subcommand"),\n'
          text = replace_once(
              text,
              first_push,
              first_push
              + '    (re.compile(r"\\bgit\\s+send-pack\\b"), "git send-pack is prohibited", "subcommand"),\n'
              + '    (re.compile(r"\\bgit\\s+http-push\\b"), "git http-push is prohibited", "subcommand"),\n'
              + '    (re.compile(r"\\bgit\\s+-c\\s+alias\\.[A-Za-z0-9_.-]+=(?:!?git\\s+)?(?:push|send-pack|http-push)\\b"), "inline git push alias is prohibited", "subcommand"),\n',
              "guard git transport blocks",
          )
          write(p, text)

          # A: private JSON authority reads validate and consume the SAME file
          # descriptor, refusing symlink/path substitution instead of checking a
          # pathname and reopening it later.
          p = "lib/ownframework_loop/util.py"
          text = read(p)
          new_private_reader = r'''def read_private_json(path: Path, default: Any = None) -> Any:
              """Read one supervisor-owned private JSON authority artifact safely.

              Validation and consumption are bound to one opened descriptor.
              Missing, redirected, non-regular, wrong-owner, loose-mode, or
              malformed artifacts return ``default``. ``O_NOFOLLOW`` is used
              when the platform exposes it; the portable fallback compares
              ``lstat`` identity to the opened descriptor before reading.
              """
              p = Path(path)
              nofollow = int(getattr(os, "O_NOFOLLOW", 0) or 0)
              flags = os.O_RDONLY | nofollow
              fd: int | None = None
              try:
                  fd = os.open(str(p), flags)
                  st = os.fstat(fd)
                  if not stat.S_ISREG(st.st_mode):
                      return default
                  if hasattr(os, "getuid") and st.st_uid != os.getuid():
                      return default
                  if stat.S_IMODE(st.st_mode) & 0o077:
                      return default
                  if not nofollow:
                      lst = os.lstat(str(p))
                      if stat.S_ISLNK(lst.st_mode):
                          return default
                      if (lst.st_dev, lst.st_ino) != (st.st_dev, st.st_ino):
                          return default
                  stream = os.fdopen(fd, "r", encoding="utf-8")
                  fd = None  # ownership transferred to stream
                  with stream:
                      return json.load(stream)
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  return default
              finally:
                  if fd is not None:
                      try:
                          os.close(fd)
                      except OSError:
                          pass


          '''
          text = replace_between(
              text,
              "def read_private_json(path: Path, default: Any = None) -> Any:\n",
              "def fsync_dir(dirpath: Path) -> None:\n",
              new_private_reader,
              "private json reader",
          )
          write(p, text)

          # B: the universal job transition primitive cannot report success when
          # durable row authority disappeared before/during the write.
          p = "lib/ownframework_loop/supervisor_db.py"
          text = read(p)
          text = replace_once(
              text,
              '    if row is None:\n        return\n    conn.execute(\n',
              '    if row is None:\n'
              '        conn.rollback()\n'
              '        raise RuntimeError(\n'
              '            f"job transition lost durable row authority: job_id={int(job_id)}"\n'
              '        )\n'
              '    cur = conn.execute(\n',
              "strict missing job transition",
          )
          text = replace_once(
              text,
              '    )\n    conn.commit()\n\n\ndef _persist_job_last_error(\n',
              '    )\n'
              '    if cur.rowcount != 1:\n'
              '        conn.rollback()\n'
              '        raise RuntimeError(\n'
              '            f"job transition lost durable row authority during update: job_id={int(job_id)}"\n'
              '        )\n'
              '    conn.commit()\n\n\ndef _persist_job_last_error(\n',
              "strict transition rowcount",
          )
          write(p, text)

          # C: every successful crash-recovery quarantine is a recovered stale
          # owner and must be reflected in the returned recovery count.
          p = "lib/ownframework_loop/supervisor_recovery.py"
          text = read(p)
          missing_attempt = '''                conn.commit()\n                continue\n\n            if (\n                str(attempt["status"] or "") == "RESERVED"\n'''
          text = replace_once(
              text,
              missing_attempt,
              '''                conn.commit()\n                recovered += 1\n                continue\n\n            if (\n                str(attempt["status"] or "") == "RESERVED"\n''',
              "missing-attempt recovery count",
          )
          cost_unknown = '''                    conn.commit()\n                    continue\n\n                effective_cost = (\n'''
          text = replace_once(
              text,
              cost_unknown,
              '''                    conn.commit()\n                    recovered += 1\n                    continue\n\n                effective_cost = (\n''',
              "cost-unknown recovery count",
          )
          token_unknown = '''                    conn.commit()\n                    continue\n\n                usage = recovered_usage or {}\n'''
          text = replace_once(
              text,
              token_unknown,
              '''                    conn.commit()\n                    recovered += 1\n                    continue\n\n                usage = recovered_usage or {}\n''',
              "token-unknown recovery count",
          )
          write(p, text)

          # C: both lock APIs expose LockBusyError for non-blocking contention.
          p = "lib/ownframework_loop/locking.py"
          text = read(p)
          text = replace_once(
              text,
              '        else:\n            fcntl.flock(fd, fcntl.LOCK_SH | fcntl.LOCK_NB)\n        yield\n',
              '        else:\n'
              '            try:\n'
              '                fcntl.flock(fd, fcntl.LOCK_SH | fcntl.LOCK_NB)\n'
              '            except BlockingIOError as e:\n'
              '                raise LockBusyError(f"shared lock {path} busy") from e\n'
              '        yield\n',
              "shared nonblocking lock contract",
          )
          write(p, text)

          # B: release-gate drain proof must ignore only the exact ps probe it
          # spawned, not an arbitrary leaked child whose executable starts
          # with the characters 'ps'.
          p = "lib/ownframework_loop/process_runner.py"
          text = read(p)
          old_probe = '''    try:\n        result = subprocess.run(\n            ["ps", "-axo", "pid=,ppid=,stat=,comm="],\n            capture_output=True, text=True, check=False, timeout=5,\n        )\n    except (subprocess.TimeoutExpired, FileNotFoundError, OSError):\n        return False\n    if result.returncode != 0 or not result.stdout.strip():\n        return False\n    own_pid = os.getpid()\n'''
          new_probe = '''    probe: subprocess.Popen[str] | None = None\n    try:\n        probe = subprocess.Popen(\n            ["ps", "-axo", "pid=,ppid=,stat=,comm="],\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.DEVNULL,\n            text=True,\n        )\n        probe_pid = int(probe.pid)\n        stdout, _ = probe.communicate(timeout=5)\n    except (subprocess.TimeoutExpired, FileNotFoundError, OSError):\n        if probe is not None and probe.poll() is None:\n            try:\n                probe.kill()\n                probe.wait(timeout=2)\n            except (OSError, subprocess.TimeoutExpired):\n                pass\n        return False\n    if probe.returncode != 0 or not stdout.strip():\n        return False\n    own_pid = os.getpid()\n'''
          text = replace_once(text, old_probe, new_probe, "exact ps probe identity")
          text = replace_once(
              text,
              '    for line in result.stdout.splitlines():\n',
              '    for line in stdout.splitlines():\n',
              "ps probe stdout",
          )
          old_ignore = '''        # The probe's own `ps` child appears in ps's own row at the moment\n        # ps walks /proc. That is the calling-side race, not a leak.\n        if pid_str == str(own_pid):\n            continue\n        if comm.startswith("ps"):\n            continue\n'''
          new_ignore = '''        # The probe's own exact PID can appear in its snapshot. Ignore that\n        # one process only; executable-name prefixes are not identity proof.\n        if pid_str == str(probe_pid):\n            continue\n'''
          text = replace_once(text, old_ignore, new_ignore, "ps-name leak bypass")
          write(p, text)

          # Canonical regression proving each closure and one anti-overblocking
          # case for generalized argv normalization.
          test_path = Path("tests/integration/test_v122_final_source_hardening.sh")
          if test_path.exists():
              raise SystemExit("final hardening test unexpectedly already exists")
          test_path.write_text(r'''#!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          . "$HERE/../_helpers.sh"
          ROOT_DIR="$(cd "$HERE/../.." && pwd)"
          export PYTHONPATH="$ROOT_DIR/lib${PYTHONPATH:+:$PYTHONPATH}"

          python3 -B <<'PYTEST'
          import fcntl
          import inspect
          import json
          import os
          import sqlite3
          import tempfile
          from pathlib import Path

          from ownframework_loop import external_action, guards, locking, process_runner
          from ownframework_loop import supervisor_db, supervisor_recovery, util

          blocked = [
              "X=git Y=push; ${X} ${Y} origin main",
              "X=git && Y=push && ${X} ${Y} origin main",
              "python -c \"import subprocess; subprocess.run(['git','push','--force','origin','main'])\"",
              "git send-pack origin refs/heads/main",
              "git http-push https://example.invalid/repo.git",
              "git -c alias.ship=push ship origin main",
          ]
          for command in blocked:
              decision = external_action.classify_tool_call(
                  tool_name="Bash", tool_input={"command": command}, active_run="run-final-hardening"
              )
              assert decision.startswith("BLOCK:"), (command, decision)
              classified = guards.classify_bash_command(command, role="builder")
              assert classified["severity"] == "forbidden", (command, classified)

          harmless = "python -c \"print(['git','push','docs','only','x'])\""
          assert external_action.classify_tool_call(
              tool_name="Bash", tool_input={"command": harmless}, active_run="run-final-hardening"
          ) == "ALLOW"
          assert guards.classify_bash_command(harmless, role="builder")["severity"] == "allowed"

          with tempfile.TemporaryDirectory() as td:
              p = Path(td) / "authority.json"
              p.write_text(json.dumps({"ok": True}), encoding="utf-8")
              os.chmod(p, 0o600)
              original = Path.read_text
              def forbidden_reopen(*args, **kwargs):
                  raise AssertionError("authority reader reopened pathname after validation")
              Path.read_text = forbidden_reopen
              try:
                  assert util.read_private_json(p) == {"ok": True}
              finally:
                  Path.read_text = original
              link = Path(td) / "authority-link.json"
              link.symlink_to(p)
              assert util.read_private_json(link, default="refused") == "refused"
          private_src = inspect.getsource(util.read_private_json)
          assert "os.open" in private_src and "os.fstat" in private_src
          assert "O_NOFOLLOW" in private_src and ".read_text" not in private_src

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.execute("CREATE TABLE jobs (id INTEGER PRIMARY KEY)")
          try:
              supervisor_db._update_job(conn, 777, status_value="QUEUED")
          except RuntimeError as exc:
              assert "lost durable row authority" in str(exc)
          else:
              raise AssertionError("missing durable job row was silently accepted")
          assert "cur.rowcount != 1" in inspect.getsource(supervisor_db._update_job)
          conn.close()

          with tempfile.TemporaryDirectory() as td:
              lock_path = Path(td) / "busy.lock"
              fd = os.open(str(lock_path), os.O_CREAT | os.O_RDWR, 0o600)
              try:
                  fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  try:
                      with locking.flock_shared(lock_path, blocking=False):
                          raise AssertionError("conflicting shared lock unexpectedly acquired")
                  except locking.LockBusyError:
                      pass
              finally:
                  fcntl.flock(fd, fcntl.LOCK_UN)
                  os.close(fd)

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.executescript("""
          CREATE TABLE jobs (
            id INTEGER PRIMARY KEY, status TEXT, worker_role TEXT, worker_pid INTEGER,
            worker_started_at REAL, worker_pgid INTEGER, worker_deadline_at REAL,
            worker_start_identity TEXT, worker_attempt_id TEXT,
            max_total_cost_usd REAL DEFAULT 0, max_total_tokens INTEGER DEFAULT 0,
            last_error TEXT, last_failure_class TEXT, last_failure_reason TEXT,
            next_attempt_at REAL DEFAULT 0, updated_at REAL
          );
          CREATE TABLE semantic_attempts (attempt_id TEXT, job_id INTEGER);
          INSERT INTO jobs (
            id,status,worker_role,worker_pid,worker_started_at,worker_pgid,
            worker_deadline_at,worker_start_identity,worker_attempt_id,updated_at
          ) VALUES (1,'RUNNING','builder',NULL,NULL,NULL,NULL,'','missing-attempt',0);
          """)
          old_local = supervisor_recovery._process_mod._local_execution_owned
          old_alive = supervisor_recovery._process_mod._pid_alive
          try:
              supervisor_recovery._process_mod._local_execution_owned = lambda job_id: False
              supervisor_recovery._process_mod._pid_alive = lambda pid, started_at: False
              recovered = supervisor_recovery._recover_stale_running(conn)
          finally:
              supervisor_recovery._process_mod._local_execution_owned = old_local
              supervisor_recovery._process_mod._pid_alive = old_alive
          assert recovered == 1, recovered
          assert conn.execute("SELECT status FROM jobs WHERE id=1").fetchone()[0] == "QUARANTINED"
          conn.close()

          drain_src = inspect.getsource(process_runner.process_group_drained)
          assert 'comm.startswith("ps")' not in drain_src
          assert "probe_pid" in drain_src

          print("V122_FINAL_SOURCE_HARDENING=PASS")
          PYTEST

          pass "final A/B/C hardening regressions"
          '''.replace("          ", ""), encoding="utf-8")
          test_path.chmod(0o755)

          canonical = Path("tests/canonical.txt")
          canon = canonical.read_text(encoding="utf-8")
          entry = "tests/integration/test_v122_final_source_hardening.sh"
          if entry in canon:
              raise SystemExit("final hardening test unexpectedly already registered")
          canonical.write_text(canon.rstrip() + "\n" + entry + "\n", encoding="utf-8")
          PY
      - name: Run focused hardening proof
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/lib${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m compileall -q lib
          bash tests/integration/test_v122_final_source_hardening.sh
          bash tests/integration/test_v085_network_mutation_defense.sh
          bash tests/integration/test_v10d_pre1_adversarial_fixes.sh
          bash tests/integration/test_runtime_recovery_lane.sh
          python3 -B -m ownframework_loop.static_checks "$PWD"
      - name: Commit exact tested patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/final-hardening-apply.yml
          git add lib/ownframework_loop/external_action.py \
                  lib/ownframework_loop/guards.py \
                  lib/ownframework_loop/util.py \
                  lib/ownframework_loop/supervisor_db.py \
                  lib/ownframework_loop/supervisor_recovery.py \
                  lib/ownframework_loop/locking.py \
                  lib/ownframework_loop/process_runner.py \
                  tests/integration/test_v122_final_source_hardening.sh \
                  tests/canonical.txt
          git diff --cached --check
          git config user.name "OwnFramework hardening bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "hardening: close final source authority defects"
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
