name: Final runtime lifecycle hardening patch

on:
  push:
    branches:
      - hardening/github-authority-closure-2026-09-22

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/github-authority-closure-2026-09-22

      - name: Apply lifecycle closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, new: str, label: str) -> str:
              if text.count(start) != 1:
                  raise SystemExit(f'{label}: start count={text.count(start)}')
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + new + text[b:]

          # Shared bytes-safe bounded capture for Git identity probes.
          p = 'lib/ownframework_loop/process_runner.py'
          text = read(p)
          if 'def run_bounded_capture_bytes(' not in text:
              anchor = '\ndef run_bounded(\n'
              helper = r'''
          def run_bounded_capture_bytes(
              argv: Sequence[str],
              *,
              cwd: Path | str | None = None,
              timeout_seconds: float | None = None,
              env: Mapping[str, str] | None = None,
              stdin: int | None = subprocess.DEVNULL,
          ) -> subprocess.CompletedProcess[bytes]:
              """Bytes variant of run_bounded_capture with identical lifecycle proof."""
              proc = subprocess.Popen(
                  list(argv),
                  cwd=str(cwd) if cwd is not None else None,
                  env=dict(env) if env is not None else None,
                  stdin=stdin,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=False,
                  start_new_session=True,
              )
              try:
                  stdout, stderr = proc.communicate(timeout=timeout_seconds)
              except subprocess.TimeoutExpired as exc:
                  terminate_process_group(proc)  # type: ignore[arg-type]
                  stdout, stderr = proc.communicate()
                  raise subprocess.TimeoutExpired(
                      list(argv), timeout_seconds, output=stdout, stderr=stderr
                  ) from exc
              except BaseException:
                  terminate_process_group(proc)  # type: ignore[arg-type]
                  raise
              returncode = int(proc.returncode)
              if process_group_exists(proc.pid):
                  terminate_process_group(proc)  # type: ignore[arg-type]
                  returncode = PROCESS_GROUP_LEAK_RC
                  stderr = (stderr or b'') + PROCESS_GROUP_LEAK_MARKER.encode('utf-8') + b'\n'
              return subprocess.CompletedProcess(
                  args=list(argv),
                  returncode=returncode,
                  stdout=stdout,
                  stderr=stderr,
              )


          '''
              text = text.replace(anchor, '\n' + textwrap.dedent(helper) + 'def run_bounded(\n', 1)
          write(p, text)

          # Runtime identity: both text and binary Git probes are now group-bounded.
          p = 'lib/ownframework_loop/runtime_identity.py'
          text = read(p)
          if 'from . import process_runner\n' not in text:
              text = replace_once(
                  text,
                  'from pathlib import Path\n\nIGNORED_DIR_NAMES',
                  'from pathlib import Path\n\nfrom . import process_runner\n\nIGNORED_DIR_NAMES',
                  'runtime identity import',
              )
          replacement = r'''def _git(root: Path, *args: str, text: bool = True) -> subprocess.CompletedProcess:
              argv = ["git", "-C", str(root), *args]
              if text:
                  return process_runner.run_bounded_capture(
                      argv, timeout_seconds=10,
                  )
              return process_runner.run_bounded_capture_bytes(
                  argv, timeout_seconds=10,
              )


          '''
          text = replace_between(text, 'def _git(root: Path, *args: str, text: bool = True)', 'def _git_head(', textwrap.dedent(replacement), 'runtime identity git')
          write(p, text)

          # Dispatch finalizer CLI is authority-bearing and must not leak descendants.
          p = 'lib/ownframework_loop/dispatch.py'
          text = read(p)
          if '    process_runner,\n' not in text:
              text = replace_once(text, '    program as program_mod,\n', '    program as program_mod,\n    process_runner,\n', 'dispatch process_runner import')
          old = '''        proc = subprocess.run(\n            [_ofloop_bin(), *args],\n            capture_output=True,\n            text=True,\n            check=False,\n            timeout=(int(timeout_seconds) if timeout_seconds and timeout_seconds > 0 else None),\n        )\n'''
          new = '''        proc = process_runner.run_bounded_capture(\n            [_ofloop_bin(), *args],\n            timeout_seconds=(int(timeout_seconds) if timeout_seconds and timeout_seconds > 0 else None),\n        )\n'''
          text = replace_once(text, old, new, 'dispatch bounded cli')
          write(p, text)

          # Release gate local Git probes use the gate's existing group-bounded primitive.
          p = 'lib/ownframework_loop/release_gate_runtime.py'
          text = read(p)
          old = 'def _git(root: Path, *args: str) -> str:\n    return subprocess.run(["git", "-C", str(root), *args], capture_output=True, text=True, check=False, timeout=10).stdout.strip()\n'
          new = '''def _git(root: Path, *args: str) -> str:\n    result = run_bounded(\n        ["git", "-C", str(root), *args],\n        cwd=root,\n        timeout_seconds=10,\n    )\n    return result.stdout.strip() if result.returncode == 0 else ""\n'''
          text = replace_once(text, old, new, 'release gate git')
          write(p, text)

          # Execution-start cleanliness proof must be bounded and tree-owned.
          p = 'lib/ownframework_loop/execution_start.py'
          text = read(p)
          old = '''    p = subprocess.run(\n        [\n            "git",\n            "-C",\n            str(canonical_repo),\n            "status",\n            "--porcelain",\n            "--untracked-files=no",\n        ],\n        capture_output=True,\n        text=True,\n        check=False,\n    )\n'''
          new = '''    p = util.run_subprocess(\n        [\n            "git",\n            "-C",\n            str(canonical_repo),\n            "status",\n            "--porcelain",\n            "--untracked-files=no",\n        ],\n        timeout=10,\n    )\n'''
          text = replace_once(text, old, new, 'execution start git status')
          write(p, text)

          # PROGRAM source accounting may not hang indefinitely or orphan helpers.
          p = 'lib/ownframework_loop/program.py'
          text = read(p)
          text = replace_once(
              text,
              'from .util import sha256_text, utc_now_iso\n',
              'from .util import run_subprocess, sha256_text, utc_now_iso\n',
              'program run_subprocess import',
          )
          old = '''    diff = subprocess.run(\n        ["git", "-C", str(canonical_repo), "diff", "--no-color", baseline_sha, candidate_sha, "--numstat"],\n        capture_output=True,\n        text=True,\n        check=True,\n    )\n'''
          new = '''    diff = run_subprocess(\n        ["git", "-C", str(canonical_repo), "diff", "--no-color", baseline_sha, candidate_sha, "--numstat"],\n        timeout=30,\n        check=True,\n    )\n'''
          text = replace_once(text, old, new, 'program source accounting')
          write(p, text)

          # Repo bootstrap is mutating authority; bound all Git effects.
          p = 'lib/ownframework_loop/cli.py'
          text = read(p)
          text = replace_once(
              text,
              '    import subprocess\n    subprocess.run(["git", "init", "-b", "master", str(target)], check=True)\n',
              '    util.run_subprocess(["git", "init", "-b", "master", str(target)], timeout=30, check=True)\n',
              'cli git init',
          )
          text = replace_once(
              text,
              '        subprocess.run(["git", "-C", str(target), "add", "README.md", ".gitignore"], check=True)\n',
              '        util.run_subprocess(["git", "-C", str(target), "add", "README.md", ".gitignore"], timeout=30, check=True)\n',
              'cli git add',
          )
          old = '''        subprocess.run(\n            ["git", "-C", str(target), "commit", "-m", "loop-v1: minimal bootstrap baseline"],\n            check=True, env=env,\n        )\n'''
          new = '''        util.run_subprocess(\n            ["git", "-C", str(target), "commit", "-m", "loop-v1: minimal bootstrap baseline"],\n            timeout=30, check=True, env=env,\n        )\n'''
          text = replace_once(text, old, new, 'cli git commit')
          write(p, text)

          # macOS service lifecycle can use test shims; bound the full shim tree.
          p = 'lib/ownframework_loop/macos_service_lifecycle.py'
          text = read(p)
          if 'from . import process_runner\n' not in text:
              text = replace_once(text, 'from typing import Sequence\n\n\n_LAUNCHCTL', 'from typing import Sequence\n\nfrom . import process_runner\n\n\n_LAUNCHCTL', 'macos lifecycle import')
          old = '''    proc = subprocess.run(\n        list(args),\n        check=False,\n        capture_output=True,\n        text=True,\n        timeout=_LAUNCHCTL_TIMEOUT_SECONDS,\n    )\n'''
          new = '''    proc = process_runner.run_bounded_capture(\n        list(args),\n        timeout_seconds=_LAUNCHCTL_TIMEOUT_SECONDS,\n    )\n'''
          text = replace_once(text, old, new, 'launchctl bounded run')
          write(p, text)

          # Operator read-model Git probes are bounded too; a hostile repo cannot leave helpers behind.
          p = 'lib/ownframework_loop/supervisor_readmodel.py'
          text = read(p)
          if 'from . import process_runner\n' not in text:
              text = replace_once(text, 'from typing import Any\n\nfrom . import state', 'from typing import Any\n\nfrom . import process_runner\nfrom . import state', 'readmodel process_runner import')
          old = '''        r = subprocess.run(\n            ["git", "-C", str(repo), *args],\n            capture_output=True,\n            text=True,\n            check=False,\n            timeout=timeout,\n        )\n'''
          new = '''        r = process_runner.run_bounded_capture(\n            ["git", "-C", str(repo), *args],\n            timeout_seconds=timeout,\n        )\n'''
          text = replace_once(text, old, new, 'readmodel bounded git')
          write(p, text)

          # Cross-platform process identity probe is observation-only but still bounded consistently.
          p = 'lib/ownframework_loop/supervisor_process.py'
          text = read(p)
          if 'from . import process_runner\n' not in text:
              text = replace_once(text, 'import time\n\n_LOCAL_EXECUTION_LOCK', 'import time\n\nfrom . import process_runner\n\n_LOCAL_EXECUTION_LOCK', 'supervisor process import')
          old = '''        r = subprocess.run(\n            ["ps", "-o", "etime=", "-p", str(pid)],\n            capture_output=True, text=True, check=False, timeout=2,\n        )\n'''
          new = '''        r = process_runner.run_bounded_capture(\n            ["ps", "-o", "etime=", "-p", str(pid)],\n            timeout_seconds=2,\n        )\n'''
          text = replace_once(text, old, new, 'supervisor ps probe')
          write(p, text)

          # Research broker owns public-network effects: timeout must drain the broker tree.
          p = 'lib/ownframework_loop/supervisor_research.py'
          text = read(p)
          if 'from . import process_runner\n' not in text:
              text = replace_once(text, 'from typing import Any, Callable\n\nREQUEST_SCHEMA', 'from typing import Any, Callable\n\nfrom . import process_runner\n\nREQUEST_SCHEMA', 'research process_runner import')
          old = '''        proc = subprocess.run(\n            cmd,\n            capture_output=True,\n            text=True,\n            check=False,\n            timeout=float(os.environ.get(\n                "OFLOOP_RESEARCH_BROKER_TIMEOUT",\n                "60",\n            )),\n        )\n'''
          new = '''        proc = process_runner.run_bounded_capture(\n            cmd,\n            timeout_seconds=float(os.environ.get(\n                "OFLOOP_RESEARCH_BROKER_TIMEOUT",\n                "60",\n            )),\n        )\n'''
          text = replace_once(text, old, new, 'research broker bounded run')
          write(p, text)

          # Semantic provider: bounded version proof, correct post-leader cleanup,
          # and normal-completion descendant refusal.
          p = 'lib/ownframework_loop/supervisor_runner.py'
          text = read(p)
          if 'from . import process_runner\n' not in text:
              text = replace_once(text, 'from . import git_checks\n', 'from . import git_checks\nfrom . import process_runner\n', 'runner process_runner import')
          old = '''        proc = subprocess.run(\n            [executable, "--version"],\n            capture_output=True,\n            text=True,\n            check=False,\n            timeout=10,\n        )\n'''
          new = '''        proc = process_runner.run_bounded_capture(\n            [executable, "--version"],\n            timeout_seconds=10,\n        )\n'''
          text = replace_once(text, old, new, 'runner version probe')
          replacement = r'''def _terminate_group(proc: subprocess.Popen[str], grace_seconds: float = 3.0) -> None:
              """Terminate the entire semantic-worker group even after leader exit."""
              process_runner.terminate_process_group(proc, grace_seconds=grace_seconds)

          '''
          text = replace_between(text, 'def _terminate_group(proc: subprocess.Popen[str], grace_seconds: float = 3.0)', 'class ClaudeCodeRunner:', textwrap.dedent(replacement), 'runner terminate group')
          old = '''        except subprocess.TimeoutExpired:\n            timed_out = True\n            try:\n                os.killpg(proc.pid, signal.SIGTERM)\n            except ProcessLookupError:\n                pass\n            try:\n                stdout_data, stderr_data = proc.communicate(timeout=10)\n            except subprocess.TimeoutExpired:\n                try:\n                    os.killpg(proc.pid, signal.SIGKILL)\n                except ProcessLookupError:\n                    pass\n                stdout_data, stderr_data = proc.communicate()\n'''
          new = '''        except subprocess.TimeoutExpired:\n            timed_out = True\n            _terminate_group(proc)\n            stdout_data, stderr_data = proc.communicate()\n'''
          text = replace_once(text, old, new, 'runner timeout cleanup')
          anchor = '''        except BaseException:\n            _terminate_group(proc)\n            if durable_files is not None:\n                stdout_fh.close()  # type: ignore[union-attr]\n                stderr_fh.close()  # type: ignore[union-attr]\n            raise\n\n        if durable_files is not None:\n'''
          replacement = '''        except BaseException:\n            _terminate_group(proc)\n            if durable_files is not None:\n                stdout_fh.close()  # type: ignore[union-attr]\n                stderr_fh.close()  # type: ignore[union-attr]\n            raise\n\n        lifecycle_leak = False\n        if not timed_out and process_runner.process_group_exists(proc.pid):\n            lifecycle_leak = True\n            _terminate_group(proc)\n\n        if durable_files is not None:\n'''
          text = replace_once(text, anchor, replacement, 'runner normal descendant check')
          anchor = '''        if timed_out:\n            if durable_files is not None and envelope_error:\n'''
          replacement = '''        if lifecycle_leak:\n            if durable_files is not None and envelope_error:\n                stderr_data = (stderr_data or "") + "\\n" + envelope_error\n            return RunnerResult(\n                ok=False,\n                returncode=process_runner.PROCESS_GROUP_LEAK_RC,\n                cost_usd=0.0,\n                stdout=(stdout_data or "")[-RUNNER_DIAGNOSTIC_MAX_CHARS:],\n                stderr=((stderr_data or "") + "\\n" + process_runner.PROCESS_GROUP_LEAK_MARKER)[-RUNNER_DIAGNOSTIC_MAX_CHARS:],\n                pid=int(proc.pid),\n                cost_known=False,\n                tokens_known=False,\n            )\n\n        if timed_out:\n            if durable_files is not None and envelope_error:\n'''
          text = replace_once(text, anchor, replacement, 'runner leak result')
          write(p, text)

          # Semantic Bash may not escape Loop's owned process tree into a new
          # session/service scheduler. Match executable identity at shell segment start.
          p = 'lib/ownframework_loop/guards.py'
          text = read(p)
          marker = '    (re.compile(r"\\bsystemctl\\s+(start|stop|restart|reload)\\b"), "systemctl is prohibited", "subcommand"),\n'
          additions = marker + '''    (re.compile(r"(?:^|[;&|\\n])\\s*(?:\\S*/)?setsid(?:\\s|$)"), "setsid process detachment is prohibited", "executable_identity"),\n    (re.compile(r"(?:^|[;&|\\n])\\s*(?:\\S*/)?daemonize(?:\\s|$)"), "daemonize process detachment is prohibited", "executable_identity"),\n    (re.compile(r"(?:^|[;&|\\n])\\s*(?:\\S*/)?systemd-run(?:\\s|$)"), "systemd-run service detachment is prohibited", "executable_identity"),\n    (re.compile(r"\\blaunchctl\\s+(?:bootstrap|kickstart|start|submit)\\b"), "launchctl service start is prohibited", "subcommand"),\n    (re.compile(r"(?:^|[;&|\\n])\\s*(?:\\S*/)?(?:at|batch|crontab)(?:\\s|$)"), "scheduled detached execution is prohibited", "executable_identity"),\n'''
          if 'setsid process detachment is prohibited' not in text:
              text = replace_once(text, marker, additions, 'guard detachment primitives')
          write(p, text)

          # Regression coverage: central runner, validation policy and semantic guard.
          p = 'tests/unit/test_final_hardening_process_and_lock.sh'
          text = read(p)
          if 'from ownframework_loop import guards\n' not in text:
              text = replace_once(text, 'from ownframework_loop import capabilities\n', 'from ownframework_loop import capabilities\nfrom ownframework_loop import guards\n', 'hardening guard test import')
          if 'def prove_semantic_detach_primitives_are_forbidden()' not in text:
              insert = r'''
          def prove_semantic_detach_primitives_are_forbidden() -> None:
              commands = (
                  "setsid sleep 30",
                  "systemd-run --user sleep 30",
                  "launchctl kickstart gui/501/com.example.test",
                  "at now",
              )
              for command in commands:
                  result = guards.classify_bash_command(command)
                  assert result["severity"] == "forbidden", (command, result)


          '''
              text = replace_once(text, 'def prove_validation_timeout_drains_descendants() -> None:\n', textwrap.dedent(insert) + 'def prove_validation_timeout_drains_descendants() -> None:\n', 'hardening detach regression')
              text = replace_once(text, 'prove_successful_leader_cannot_hide_live_descendant()\n', 'prove_successful_leader_cannot_hide_live_descendant()\nprove_semantic_detach_primitives_are_forbidden()\n', 'hardening detach invocation')
          write(p, text)
          PY

          python3 -m compileall -q lib/ownframework_loop
          bash tests/unit/test_final_hardening_process_and_lock.sh
          git diff --check

          echo '--- raw process surfaces after patch ---'
          grep -RInE 'subprocess\.(run|Popen)|os\.system\(|shell[[:space:]]*=[[:space:]]*True' lib/ownframework_loop || true

      - name: Commit lifecycle closure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- lib tests)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib tests
          git commit -m 'hardening: close authoritative process lifecycle gaps'
          git push origin HEAD:hardening/github-authority-closure-2026-09-22
