name: Pre-1.0 final correction

on:
  push:
    branches:
      - 'hardening/pre-1.0-adversarial-audit'

permissions:
  contents: write

jobs:
  correct-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply bounded source correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          # -----------------------------------------------------------------
          # B002: diagnostic-only persistence primitive. It intentionally does
          # not reuse _update_job because _update_job is a lifecycle transition
          # and clears worker ownership fields.
          # -----------------------------------------------------------------
          db_path = Path('lib/ownframework_loop/supervisor_db.py')
          db_text = db_path.read_text()
          if 'def _persist_job_last_error(' in db_text:
              raise SystemExit('supervisor_db.py already contains _persist_job_last_error')
          db_append = '''\n\n\ndef _persist_job_last_error(\n    conn: sqlite3.Connection,\n    job_id: int,\n    *,\n    last_error: str,\n) -> None:\n    \"\"\"Persist diagnostic truth without performing a lifecycle transition.\n\n    Unlike ``_update_job``, this primitive preserves status, counters, retry\n    timing, and every worker-ownership field.  It exists for recovery paths\n    that need to record an operator-visible diagnostic while leaving durable\n    lifecycle meaning untouched.  A missing job is a programming/invariant\n    error and is surfaced rather than silently swallowed.\n    \"\"\"\n    import time as _time\n    cur = conn.execute(\n        \"UPDATE jobs SET last_error=?, updated_at=? WHERE id=?\",\n        (str(last_error), _time.time(), int(job_id)),\n    )\n    if cur.rowcount != 1:\n        conn.rollback()\n        raise RuntimeError(\n            f\"diagnostic persistence lost job row authority: job_id={int(job_id)}\"\n        )\n    conn.commit()\n'''
          db_path.write_text(db_text.rstrip() + db_append + '\n')

          attempts_path = Path('lib/ownframework_loop/supervisor_attempts.py')
          attempts_text = attempts_path.read_text()
          helper_marker = '\n\n\n\ndef _maybe_complete_semantic_artifact('
          if attempts_text.count(helper_marker) != 1:
              raise SystemExit('supervisor_attempts helper insertion marker mismatch')
          helper = '''\n\n\ndef _persist_semantic_acceptance_failure(\n    conn: sqlite3.Connection,\n    *,\n    job_id: int,\n    exc: RuntimeError,\n) -> None:\n    \"\"\"Persist an acceptance refusal without changing lifecycle ownership.\n\n    Semantic-acceptance ``RuntimeError`` is an expected fail-closed refusal.\n    Recording its cause is diagnostic-only: job status and worker ownership\n    must remain exactly as they were.  Diagnostic persistence failures are\n    deliberately allowed to propagate so deterministic programming defects\n    cannot disappear behind a broad best-effort catch.\n    \"\"\"\n    _db_mod._persist_job_last_error(\n        conn,\n        int(job_id),\n        last_error=(\n            f\"semantic_acceptance_publication_failed: {exc}\"\n        )[-4000:],\n    )\n'''
          attempts_text = attempts_text.replace(helper_marker, helper + helper_marker, 1)

          old_maybe = '''        except RuntimeError as exc:\n            # v0.10.0-dev b002: narrow the catch from `except Exception` to\n            # `except RuntimeError as exc` and surface the actual cause on\n            # last_error so the downstream gate refusal carries diagnostic\n            # context for the operator. The gate below still rejects replay\n            # when semantic_accepted=0, but the operator sees the real cause\n            # (identity drift, missing attempt row, unaccounted cost) rather\n            # than the gate's opaque refusal reason.\n            try:\n                _db_mod._update_job(\n                    conn,\n                    int(job_id),\n                    last_error=(\n                        f\"semantic_acceptance_publication_failed: {exc}\"\n                    )[-4000:],\n                )\n            except Exception:\n                pass\n'''
          new_maybe = '''        except RuntimeError as exc:\n            # B002: publication refusal is recoverable, but its cause must be\n            # durable without changing status or worker ownership.\n            _persist_semantic_acceptance_failure(\n                conn, job_id=int(job_id), exc=exc\n            )\n'''
          if attempts_text.count(old_maybe) != 1:
              raise SystemExit('supervisor_attempts maybe-complete B002 block mismatch')
          attempts_text = attempts_text.replace(old_maybe, new_maybe, 1)

          old_ready = '''    except RuntimeError as exc:\n        # v0.10.0-dev b002: surface the actual cause on last_error so the\n        # downstream gate refusal carries diagnostic context. The gate still\n        # rejects replay when semantic_accepted=0, but the operator now sees\n        # the real reason (identity drift, missing attempt, unaccounted cost)\n        # rather than an opaque refusal.\n        # The helper reuses the existing job status (typically RUNNING); pass\n        # it through so _update_job's required status_value kwarg is satisfied.\n        try:\n            current_status = conn.execute(\n                \"SELECT status FROM jobs WHERE id=?\", (int(job_id),)\n            ).fetchone()\n            status_value = str(current_status[\"status\"] or \"RUNNING\") if current_status else \"RUNNING\"\n            _db_mod._update_job(\n                conn,\n                int(job_id),\n                status_value=status_value,\n                last_error=(\n                    f\"semantic_acceptance_publication_failed: {exc}\"\n                )[-4000:],\n            )\n        except Exception:\n            # The surface-call must not mask a programming defect in the\n            # publication helper itself. Re-raising here would silently abort\n            # the recovery path; logging the cause is sufficient because\n            # the gate's downstream refusal already carries diagnostic context.\n            pass\n'''
          new_ready = '''    except RuntimeError as exc:\n        # B002: symmetric with builder-side fillable completion.  Persist only\n        # the diagnostic; do not perform a lifecycle transition here.\n        _persist_semantic_acceptance_failure(\n            conn, job_id=int(job_id), exc=exc\n        )\n'''
          if attempts_text.count(old_ready) != 1:
              raise SystemExit('supervisor_attempts ready-artifact B002 block mismatch')
          attempts_path.write_text(attempts_text.replace(old_ready, new_ready, 1))

          # -----------------------------------------------------------------
          # F007: a valid pending journal may explain unreadable/torn STATE
          # bytes. Parseable unjournaled mismatch remains tampering.
          # -----------------------------------------------------------------
          state_path = Path('lib/ownframework_loop/state.py')
          state_text = state_path.read_text()
          old_recovery = '''    if current_sha == prior_state_sha:\n        atomic_write_json(sp, new_state, mode=0o600)\n        current_sha = integrity.sha256_file(sp)\n    elif current_sha != new_sha:\n        raise integrity.TamperingDetected(\n            \"pending state transaction prior state binding mismatch\"\n        )\n'''
          new_recovery = '''    if current_sha == prior_state_sha:\n        atomic_write_json(sp, new_state, mode=0o600)\n        current_sha = integrity.sha256_file(sp)\n    elif current_sha != new_sha:\n        # A valid write-ahead journal is the only authority allowed to explain\n        # unreadable/torn STATE bytes.  If the current bytes still parse, the\n        # mismatch is adversarial/foreign and must never be laundered through\n        # the journal.  If they do not parse, complete the exact journaled\n        # state and then re-prove its digest below.\n        current_doc = read_json(sp, default=None) if sp.exists() else None\n        if current_doc is None:\n            atomic_write_json(sp, new_state, mode=0o600)\n            current_sha = integrity.sha256_file(sp)\n        else:\n            raise integrity.TamperingDetected(\n                \"pending state transaction prior state binding mismatch\"\n            )\n'''
          if state_text.count(old_recovery) != 1:
              raise SystemExit('state.py pending journal recovery block mismatch')
          state_text = state_text.replace(old_recovery, new_recovery, 1)
          old_comment = '''            # v0.10.0-dev f007: distinguish torn-write (STATE.json bytes do\n            # not parse as JSON OR do not match recorded SHA) from adversarial\n            # tampering. A torn write is recoverable: re-run the pending-journal\n            # recovery path under the same flock and return the recovered\n            # state. Adversarial tampering still raises TamperingDetected.\n            #\n            # The distinguishing signal: a torn file fails to parse as JSON\n            # (read_json returns the default) OR parses cleanly but the SHA\n            # does not match (msg starts with \"state sha mismatch:\").\n            #\n            # Strategy:\n            # 1. Read the file via read_json. If it returns the default,\n            #    the file is unreadable/torn → attempt journal recovery.\n            # 2. Otherwise parse the bytes (we already have a dict), but\n            #    the SHA didn't match. This is adversarial tampering; do\n            #    NOT attempt journal recovery (the journal is also under\n            #    the attacker's control).\n'''
          new_comment = '''            # v0.10.0-dev f007: an unreadable STATE.json is a torn-state\n            # condition, while a parseable SHA mismatch is tampering.  A valid\n            # pending journal is attempted under the same flock; without one,\n            # unreadable bytes surface as StateTorn.  Parseable mismatches are\n            # never laundered into authority by journal recovery.\n'''
          if state_text.count(old_comment) != 1:
              raise SystemExit('state.py load_verified F007 comment mismatch')
          state_path.write_text(state_text.replace(old_comment, new_comment, 1))

          # -----------------------------------------------------------------
          # Behavioral proofs: owner-level A002, real F007 state/journal cases,
          # and symmetric B002 persistence with worker-field preservation.
          # -----------------------------------------------------------------
          test_path = Path('tests/integration/test_v10e_pre1_behavioral_proofs.sh')
          test_text = test_path.read_text()
          replace_import = 'import tempfile\nimport time\nfrom pathlib import Path\n'
          if test_text.count(replace_import) != 1:
              raise SystemExit('v10e import marker mismatch')
          test_text = test_text.replace(
              replace_import,
              'import tempfile\nimport time\nimport types\nfrom pathlib import Path\n',
              1,
          )
          import_marker = 'import ownframework_loop.supervisor_recovery as recovery_mod\n'
          if test_text.count(import_marker) != 1:
              raise SystemExit('v10e supervisor import marker mismatch')
          test_text = test_text.replace(
              import_marker,
              import_marker + 'import ownframework_loop.supervisor as supervisor_mod\n'
              + 'import ownframework_loop.supervisor_claims as claims_mod\n',
              1,
          )

          a002_insert_marker = '''# Restore\ndispatch_mod.semantic_result_ready = real_srr\nstate_mod.load_verified = real_load\n\n# =========================================================================\n# F003 BEHAVIORAL: semantic_result_ready scope-match enforcement\n'''
          if test_text.count(a002_insert_marker) != 1:
              raise SystemExit('v10e A002 insertion marker mismatch')
          a002_block = r'''# Restore
dispatch_mod.semantic_result_ready = real_srr
state_mod.load_verified = real_load

# Owner-level proof: run_one computes the timeout supplied TO finalize_work_order.
