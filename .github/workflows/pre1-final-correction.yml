        "replay_sha": supervisor_mod._replay_candidate_sha,
        "publish": supervisor_mod._publish_semantic_acceptance,
        "finalize": dispatch_mod.finalize_work_order,
        "time": supervisor_mod.time,
    }
    try:
        claims_mod._take_next_job = lambda c: c.execute(
            "SELECT * FROM jobs WHERE run_id='a002-owner-r'"
        ).fetchone()
        supervisor_mod._current_runtime_generation = lambda: "gen-test"
        supervisor_mod._register_local_execution = lambda _job_id: None
        dispatch_mod.claim_next = lambda **_kwargs: dict(work_order)
        dispatch_mod.semantic_result_ready = semantic_ready
        supervisor_mod._maybe_complete_semantic_artifact = lambda **_kwargs: False
        supervisor_mod._runner_preflight = lambda _name: types.SimpleNamespace(
            ready=True, classification="", reason="", retry_after_seconds=0.0,
            detail="",
        )
        supervisor_mod._capability_binding_creation_allowed = lambda *_a, **_k: True
        supervisor_mod._reserve_semantic_attempt = lambda *_a, **_k: (
            "a002-owner-attempt", (case_root / "stdout", case_root / "stderr")
        )
        supervisor_mod.packet_mod.parse_packet_file = lambda _path: (
            {"risk_budget": {"max_pass_runtime_seconds": 7200}}, ""
        )
        supervisor_mod._ensure_execution_started = lambda *_a, **_k: 1000.0
        supervisor_mod._runner = lambda _name: FakeRunner()
        supervisor_mod._account_attempt_cost = lambda *_a, **_k: 0.0
        supervisor_mod._replay_candidate_sha = lambda **_kwargs: "c" * 40
        supervisor_mod._publish_semantic_acceptance = lambda *_a, **_k: None
        dispatch_mod.finalize_work_order = lambda _wo, *, timeout_seconds=0: (
            calls.append(int(timeout_seconds)) or {"finalized": True}
        )
        supervisor_mod.time = types.SimpleNamespace(time=fake_clock)
        result = supervisor_mod.run_one(db_path=db_path)
        conn = sqlite3.connect(str(db_path))
