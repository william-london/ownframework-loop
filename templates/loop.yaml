# OwnFramework Loop per-repository policy. Drop into <repo>/.claude/loop.yaml.
#
# NOTE: execution pacing is dispatch-driven. The supervisor hands the next
# actionable BUILD/REVIEW work order to the next semantic pass with no
# deliberate idle gap; there are NO polling intervals to configure. The
# historical build/review interval_minutes keys belonged to the retired
# polling orchestrator and must not be reintroduced.
schema: ownframework-loop-policy/v1
version: 0.1.0
factory:
  source: /path/to/ownframework-loop
  version: 0.1.0
risk_policy:
  default_risk: medium
  max_repair_rounds: 3
  max_diff_lines: 400
  max_files_changed: 12
  max_runtime_seconds: 28800
  max_pass_runtime_seconds: 1800
branch_policy:
  expected_branch: <baseline-branch>
  work_branch_prefix: factory/candidate/
  protected_branches:
    - <baseline-branch>
protected_paths:
  - AGENTS.md
  - CLAUDE.md
  - .claude/
  - .ownframework-loop/
  - .worktrees/ownframework-loop/
  - state/
remotes:
  local_only_default: true
  block_remote_creation: true
  block_push: true
  block_merge: true
  block_deploy: true
